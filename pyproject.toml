[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-deep-research"
version = "0.1.0"
description = "Evidence-first tools for OpenCode-native crypto research"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
crypto-research = "crypto_research.__main__:main"

[tool.setuptools.packages.find]
include = ["crypto_research*"]
